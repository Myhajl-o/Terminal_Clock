* This is the project Terminal_Clock configuration file.
  Using this file, you can radically change the appearance
  of this terminal utility and create your own custom clock.

  Here you have the ability to change the clock width, freely change colors
  for any object, and also change the characters of the objects.

  !!! A number can only be read if it is preceded by an '=' sign,
  characters can only be read if they are preceded by a '-' sign. *


